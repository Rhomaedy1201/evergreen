name: evergreen-daily

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evergreen-daily
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update catatan harian
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          MONTH=$(date -u +%Y-%m)
          mkdir -p log
          echo "$NOW" > last-run.txt
          echo "- $NOW: evergreen run" >> "log/$MONTH.md"

      - name: Commit dan push
        run: |
          git config user.name "Rhomaedy1201"
          git config user.email "57169929+Rhomaedy1201@users.noreply.github.com"
          for i in 1 2 3; do
            echo "- $(date -u +'%Y-%m-%d %H:%M:%S UTC') run $i" >> "log/$(date -u +%Y-%m).md"
            git add -A
            git commit -m "chore: daily update $(date -u +%F) #$i"
          done
          git push